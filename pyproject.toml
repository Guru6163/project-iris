[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "project-iris"
version = "0.1.0"
description = "Project IRIS technical assessment"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "psycopg[binary]>=3.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[tool.hatch.build.targets.wheel]
packages = ["iris"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
